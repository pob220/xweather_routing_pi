version: 2.1
parameters:
  build_xweather_identity:
    type: boolean
    default: true
orbs:
  win: circleci/windows@5.1.0
jobs:
  windows-x86:
    parameters:
      api_headers:
        type: string
        default: '1.21'
    executor:
      name: win/server-2022
      shell: bash.exe
    environment:
      WEATHER_ROUTING_API_HEADER_VERSION: << parameters.api_headers >>
      OCPN_TARGET: MSVC
      MSVC_VERSION: '2022'
      WX_VER: '32'
      WEATHER_ROUTING_CI_XWEATHER: << pipeline.parameters.build_xweather_identity
        >>
      WR_HEADLESS_LIFECYCLE_CONTRACT: '1'
    steps:
    - checkout
    - run:
        shell: cmd.exe
        name: Native Windows build, tests and package
        command: ci\circleci-build-msvc.bat
        no_output_timeout: 45m
    - store_test_results:
        path: artifacts/windows-x86/tests
    - store_artifacts:
        path: artifacts/windows-x86
  windows-x64:
    parameters:
      api_headers:
        type: string
        default: '1.21'
    executor:
      name: win/server-2022
      shell: bash.exe
    environment:
      WEATHER_ROUTING_API_HEADER_VERSION: << parameters.api_headers >>
      WEATHER_ROUTING_CI_XWEATHER: << pipeline.parameters.build_xweather_identity
        >>
      WR_HEADLESS_LIFECYCLE_CONTRACT: '1'
    steps:
    - checkout
    - restore_cache:
        keys:
        - windows64-upstream-v1-{{ checksum "ci/windows64-sdk.json" }}
    - run:
        shell: cmd.exe
        name: Upstream OpenCPN 5.14.2 x64 build, tests and import verification
        command: ci\circleci-build-windows64.bat
        no_output_timeout: 45m
    - save_cache:
        key: windows64-upstream-v1-{{ checksum "ci/windows64-sdk.json" }}
        paths:
        - .windows64/cache
    - store_test_results:
        path: artifacts/windows-x64/tests
    - store_artifacts:
        path: artifacts/windows-x64
workflows:
  route-lifecycle:
    jobs:
    - windows-x86
    - windows-x64
