version: 2.1
parameters:
  run_workflow_deploy: {type: boolean, default: false}
  run_full_host: {type: boolean, default: false}
orbs:
  win: circleci/windows@5.1.0
jobs:
  watcher-regression:
    executor:
      name: win/server-2022
      shell: bash.exe
    steps:
      - checkout
      - run:
          name: Reproduce the old watcher bug and verify the fix with wxWidgets 3.2.9 and 3.3.4
          shell: cmd.exe
          command: ci\build-fixed-host.bat regression
          no_output_timeout: 15m
      - store_artifacts: {path: shutdown-artifacts}
      - store_test_results: {path: shutdown-artifacts}
  fixed-host:
    executor:
      name: win/server-2022
      shell: bash.exe
    steps:
      - checkout
      - run:
          name: Prepare the pinned official OpenCPN source and USB lifetime fix
          command: python ci/prepare-core-fix.py
      - restore_cache:
          keys: [core-wx334-dependencies-v1]
      - run:
          name: Prepare official core build dependencies
          shell: cmd.exe
          command: ci\build-fixed-host.bat deps
          no_output_timeout: 30m
      - save_cache:
          key: core-wx334-dependencies-v1-{{ epoch }}
          paths: [core-source/cache]
      - run:
          name: Build OpenCPN and test window-close, remote quit, routing and reinstall
          shell: cmd.exe
          command: ci\build-fixed-host.bat all
          no_output_timeout: 45m
      - store_artifacts: {path: shutdown-artifacts}
      - store_test_results: {path: shutdown-artifacts}
workflows:
  qualify-core-fix:
    jobs: [watcher-regression]
  full-core-fix:
    when: << pipeline.parameters.run_full_host >>
    jobs: [fixed-host]
