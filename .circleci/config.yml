version: 2.1

# Deployment-only collection of the exact 1.17.3 artifacts. No build jobs.
# Isolated publication branch: never merge this workflow into the source branch.
jobs:
  collect-reviewed-artifacts:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    steps:
      - checkout
      - run:
          name: Test publication and provenance guards
          command: python3 -m unittest discover -s ci/tests -v
      - run:
          name: Wait for and validate existing 1.17.3 builds
          command: python3 ci/collect-reviewed-1.17.3.py artifacts
          no_output_timeout: 50m
      - run:
          name: Validate complete publication matrix without uploading
          command: >-
            python3 ci/prepare-alpha-artifacts.py artifacts dry-publication
            f4cc75e8c338b0aa417fb929e826e47676c1b2a7 "${CIRCLE_BUILD_NUM}"
      - store_artifacts:
          path: dry-publication
      - persist_to_workspace:
          root: .
          paths: [artifacts]

  deploy-alpha:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    environment:
      XWEATHER_ARTIFACT_REVISION: "f4cc75e8c338b0aa417fb929e826e47676c1b2a7"
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install deployment client
          command: python -m pip install --user cloudsmith-cli
      - run:
          name: Test publication guards
          command: python3 -m unittest discover -s ci/tests -v
      - run:
          name: Upload reviewed 1.17.3 packages to Open-Source repository
          command: bash ci/deploy-alpha-artifacts.sh
      - store_artifacts:
          path: alpha-publication

workflows:
  publish-existing-1-17-3:
    jobs:
      - collect-reviewed-artifacts
      - deploy-alpha:
          context: xgrib-deployment
          requires: [collect-reviewed-artifacts]
