version: 2.1

# Rebuild only the Debian 13 target after a verified CA-file bootstrap fix; retain the eight passing builds.
# Isolated publication branch: never merge this workflow into the source branch.
jobs:
  trixie-recovery:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    environment:
      OCPN_TARGET: trixie
      DOCKER_IMAGE: debian:trixie
      BUILD_ENV: debian
      DOCKERFILE: ci/Dockerfile.linux
      BUILD_GTK3: "true"
      WX_VER: "32"
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
    steps:
      - checkout
      - run:
          name: Verify unchanged 1.17.4 plugin sources and publication guards
          command: |
            git diff --exit-code 01877da7e4c0c7d414ef29ced0c443e00bab756a HEAD -- . \
              ':(exclude)ci/**' ':(exclude).circleci/**' \
              ':(exclude)README.md' ':(exclude)docs/alpha-publication.md'
            python3 -m unittest discover -s ci/tests -v
      - run: chmod a+x ci/*.sh
      - run:
          name: Build Debian 13 only, with bounded HTTPS dependency bootstrap
          command: ci/circleci-build-ubuntu-docker.sh
          no_output_timeout: 20m
      - store_artifacts:
          path: artifacts
          destination: artifacts

  collect-reviewed-artifacts:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    steps:
      - checkout
      - run:
          name: Test publication and provenance guards
          command: python3 -m unittest discover -s ci/tests -v
      - run:
          name: Wait for and validate existing 1.17.4 builds
          command: python3 ci/collect-reviewed-1.17.4.py artifacts --current-workflow-trixie --wait-seconds 2700
          no_output_timeout: 50m
      - run:
          name: Validate complete publication matrix without uploading
          command: >-
            python3 ci/prepare-alpha-artifacts.py artifacts dry-publication
            01877da7e4c0c7d414ef29ced0c443e00bab756a "${CIRCLE_BUILD_NUM}"
      - store_artifacts:
          path: dry-publication
      - persist_to_workspace:
          root: .
          paths: [artifacts]

  deploy-alpha:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    environment:
      XWEATHER_ARTIFACT_REVISION: "01877da7e4c0c7d414ef29ced0c443e00bab756a"
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install deployment client
          command: python -m pip install --user cloudsmith-cli
      - run:
          name: Test publication guards
          command: python3 -m unittest discover -s ci/tests -v
      - run:
          name: Upload reviewed 1.17.4 packages to Open-Source repository
          command: bash ci/deploy-alpha-artifacts.sh
      - store_artifacts:
          path: alpha-publication

workflows:
  recover-trixie-and-publish-1-17-4:
    jobs:
      - trixie-recovery:
          name: debian13-x86_64-recovery
      - collect-reviewed-artifacts:
          requires: [debian13-x86_64-recovery]
      - hold-for-oss-alpha-approval:
          type: approval
          requires: [collect-reviewed-artifacts]
      - deploy-alpha:
          context: xgrib-deployment
          requires: [hold-for-oss-alpha-approval]
