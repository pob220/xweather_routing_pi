version: 2.1
parameters:
  run_workflow_deploy: {type: boolean, default: false}
orbs:
  win: circleci/windows@5.1.0
jobs:
  shutdown-diagnostics:
    executor:
      name: win/server-2022
      shell: bash.exe
    steps:
      - checkout
      - run:
          name: Compare clean host and plugin shutdown on wxWidgets 3.3.4
          command: python ci/diagnose-windows-shutdown.py
          no_output_timeout: 15m
      - store_artifacts:
          path: shutdown-artifacts
workflows:
  diagnose:
    jobs: [shutdown-diagnostics]
