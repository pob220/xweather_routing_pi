name: build-win64
on:
  workflow_dispatch:
  push:
    paths: ['CMakeLists.txt', 'src/**', 'include/**', 'test/**', '.github/workflows/build-win64.yml']
permissions:
  contents: read
concurrency:
  group: windows-maintenance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-win64:
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        wx: ['3.3.4', '3.2.9']
    env:
      WEATHER_ROUTING_WINDOWS_WX_VERSION: ${{ matrix.wx }}
      WEATHER_ROUTING_CI_XWEATHER: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'
      - uses: actions/cache@v4
        with:
          path: |
            .windows64/cache
            .windows64-wx329/cache
          key: wr-sdk-${{ matrix.wx }}-${{ hashFiles('ci/*sdk.json') }}
      - name: Install gettext tools
        shell: pwsh
        run: |
          choco install gettext --version 1.0.0.20260310 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'GNU gettext installation failed' }
          "C:\Program Files\gettext-iconv\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build, package and test matched OpenCPN host
        run: python ci/circleci-build-windows64.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xWeatherRouting-1.36.1-windows-x64-wx${{ matrix.wx }}
          include-hidden-files: true
          path: |
            artifacts/windows-x64
            compatibility/windows-x64-wx329
            .windows64/build/Testing/Temporary
            .windows64-wx329/build/Testing/Temporary
