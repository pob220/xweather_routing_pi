name: build-win64

on:
  workflow_dispatch:
  push:
    paths:
      - '.gitattributes'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'ci/**'
      - 'third_party/**'
      - 'opencpn-libs'
      - '.github/workflows/build-win64.yml'
      - 'src/**'
      - 'include/**'
      - 'test/**'
      - 'data/**'
      - 'vendor/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-v2-${{ github.ref }}
  # Let a cold scientific dependency build finish and save its binary cache.
  cancel-in-progress: false

jobs:
  generator:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.windows-deps/binary-cache,readwrite
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'
      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: |
            .windows-deps/binary-cache
            .windows-deps/vcpkg/downloads
          key: wr-v2-msvc2022-release-${{ hashFiles('ci/windows-generator/vcpkg.json', 'ci/vcpkg-triplets/**', 'ci/vcpkg-overlay-ports/**') }}
      - name: Prepare scientific dependencies
        run: python ci/build-windows-generator.py --dependencies-only
      - uses: actions/cache/save@v4
        if: always() && steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: |
            .windows-deps/binary-cache
            .windows-deps/vcpkg/downloads
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Build, test and stage independent GRIB helper
        run: python ci/build-windows-generator.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-generator-stage
          include-hidden-files: true
          path: |
            .windows-deps/stage/bin
            .windows-deps/stage/runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-generator-checks
          include-hidden-files: true
          path: |
            .windows-deps/logs
            .windows-deps/vcpkg/buildtrees/**/*.log
            .windows-deps/build/CMakeCache.txt

  build-win64:
    needs: generator
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        wx: ['3.3.4', '3.2.9']
    env:
      WEATHER_ROUTING_WINDOWS_WX_VERSION: ${{ matrix.wx }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'
      - uses: actions/download-artifact@v4
        with:
          name: windows-generator-stage
          path: .windows-deps/stage
      - uses: actions/cache@v4
        with:
          path: |
            .windows64/cache
            .windows64-wx329/cache
          key: wr-sdk-${{ matrix.wx }}-${{ hashFiles('ci/*sdk.json') }}
      - name: Install gettext tools
        shell: pwsh
        run: |
          choco install gettext --version 1.0.0.20260310 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "GNU gettext installation failed" }
          "C:\Program Files\gettext-iconv\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build, package and test matched OpenCPN host
        run: python ci/circleci-build-windows64.py --skip-generator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xWeatherRouting-2.0.0-windows-x64-wx${{ matrix.wx }}
          include-hidden-files: true
          path: |
            artifacts/windows-x64
            compatibility/windows-x64-wx329
            .windows64/build/Testing/Temporary
            .windows64-wx329/build/Testing/Temporary
